# Cloud Foundry manifest.
#   1. Set the Azure (and optional live MCP) values as app env vars, once:
#        cf set-env sales-assistant AZURE_OPENAI_ENDPOINT   https://<resource>.openai.azure.com
#        cf set-env sales-assistant AZURE_OPENAI_API_KEY    <key>
#        cf set-env sales-assistant AZURE_OPENAI_DEPLOYMENT gpt-4.1
#        cf set-env sales-assistant AZURE_OPENAI_API_VERSION 2024-10-21
#      They survive later pushes. Keep them OUT of this file (it's in git).
#   2. make cf-push   (builds the UI, then cf push)
---
applications:
  - name: sales-assistant
    memory: 512M
    disk_quota: 1G
    instances: 1 # sessions are in memory; scale out only after adding a shared store
    buildpacks:
      - python_buildpack
    command: >-
      python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips='*' --no-server-header --timeout-keep-alive 75
    health-check-type: http
    health-check-http-endpoint: /healthz
    timeout: 120
    env:
      APP_ENV: dev
      LOG_LEVEL: INFO
      MCP_AUTH_REQUIRED: "false" # /mcp open for now; set "true" and add MCP_SERVER_TOKEN before exposing it
      # MCP_ALLOWED_HOSTS: sales-assistant.apps.example.com
