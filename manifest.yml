# Cloud Foundry manifest.
#   1. make build-web            (the Python buildpack does not run npm; ship the built UI)
#   2. make cf-secrets           (creates/updates the user-provided service from your .env)
#   3. cf push                   (or: make cf-push, which does 1 + 3)
#
# AZURE_OPENAI_* and LIVE_MCP_* live in the user-provided service "sales-assistant-secrets"
# (make cf-secrets copies them from .env), never in this file.
# Bind your proxy service too (add it under services: or `cf bind-service`): it sets HTTPS_PROXY,
# which the Azure OpenAI SDK uses automatically. Local runs call Azure directly.
---
applications:
  - name: sales-assistant
    memory: 512M
    disk_quota: 1G
    instances: 1 # sessions are in memory; scale out only after adding a shared store
    buildpacks:
      - python_buildpack
    command: >-
      python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips='*' --no-server-header --timeout-keep-alive 75
    health-check-type: http
    health-check-http-endpoint: /healthz
    timeout: 120
    env:
      APP_ENV: dev
      LOG_LEVEL: INFO
      SECRETS_SERVICE_NAME: sales-assistant-secrets
      MCP_AUTH_REQUIRED: "false" # /mcp open for now; set "true" and add MCP_SERVER_TOKEN before exposing it
      # MCP_ALLOWED_HOSTS: sales-assistant.apps.example.com
    services:
      - sales-assistant-secrets
      # - <your-proxy-service>   # sets HTTPS_PROXY for calls to Azure OpenAI
