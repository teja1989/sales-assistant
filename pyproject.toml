[project]
name = "tidelink-assist"
version = "0.1.0"
description = "MCP-powered support and sales chat assistant prototype"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web", "app/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = [
  "S101",  # assert in tests
  "S105",  # test fixture strings that look like passwords
  "S106",
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017"]
# Prompt and demo-dialogue text reads better unwrapped.
"app/prompts.py" = ["E501"]
"app/llm/mock.py" = ["E501"]
# Inline HTML templates for the mock sign-in page.
"app/oauth.py" = ["E501", "S608"]
